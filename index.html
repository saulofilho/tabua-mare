    <script>

            };

            setAttr('meta[property="og:image"]', 'content', absImg);
            setAttr('meta[property="og:image:url"]', 'content', absImg);
            setAttr('meta[property="og:image:secure_url"]', 'content', absImg);
            setAttr('meta[name="twitter:image"]', 'content', absImg);
            setAttr('link[rel="image_src"]', 'href', absImg);
            setAttr('meta[itemprop="image"]', 'content', absImg);
            setAttr('meta[name="thumbnail"]', 'content', absImg);
            setAttr('meta[property="og:url"]', 'content', currentUrl);
            
            var canUrl = document.querySelector('link[rel="canonical"]');
            if (!canUrl) {
              canUrl = document.createElement('link');
              canUrl.setAttribute('rel', 'canonical');
              document.head.appendChild(canUrl);
            }
            canUrl.setAttribute('href', currentUrl);
          }
        } catch (e) {}
