<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Tactical background -->
  <rect width="64" height="64" rx="14" fill="#111111" />
  
  <!-- Outer border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#f8f7f4" stroke-width="2" />
  
  <!-- Compass tick marks -->
  <line x1="32" y1="2" x2="32" y2="6" stroke="#d42020" stroke-width="2" />
  <line x1="32" y1="58" x2="32" y2="62" stroke="#d42020" stroke-width="2" />
  <line x1="2" y1="32" x2="6" y2="32" stroke="#d42020" stroke-width="2" />
  <line x1="58" y1="32" x2="62" y2="32" stroke="#d42020" stroke-width="2" />

  <!-- Nautical wave lines -->
  <path d="M 10 48 Q 21 44 32 48 T 54 48" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
  <path d="M 12 53 Q 22 49 32 53 T 52 53" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Anchor Ring -->
  <circle cx="32" cy="18" r="5" fill="none" stroke="#f8f7f4" stroke-width="2.5" />
  <circle cx="32" cy="18" r="2" fill="#d42020" />

  <!-- Anchor Crossbar -->
  <line x1="22" y1="26" x2="42" y2="26" stroke="#f8f7f4" stroke-width="2.5" stroke-linecap="round" />

  <!-- Anchor Shank (Shaft) -->
  <line x1="32" y1="20" x2="32" y2="44" stroke="#f8f7f4" stroke-width="3" stroke-linecap="round" />

  <!-- Anchor Arms (Flukes) -->
  <path d="M 18 36 C 18 47, 46 47, 46 36" fill="none" stroke="#d42020" stroke-width="3.5" stroke-linecap="round" />
  
  <!-- Anchor Palms (Arrow tips) -->
  <polygon points="15,36 21,36 18,31" fill="#d42020" />
  <polygon points="43,36 49,36 46,31" fill="#d42020" />
</svg>
